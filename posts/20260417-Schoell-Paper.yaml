# Write here the body of the post. Some characters may break the parsing, so you can use quotes for the full body.
body: Context. During the first stages of dust coagulation in protoplanetary disks, the dust aggregates are expected to have a high degree of porosity. Most models of dust growth, however, do not take this into account. The reason for this is the technical complexity of this problem. Furthermore, the coagulation kernel for colliding porous or fractal dust aggregates is not well understood. Aims. We wish to explore the effect of aggregate porosity on the evolution of the dust population in protoplanetary disks, with an emphasis on the fragmentation and the bouncing barrier. Methods. We use the DustPy code, and implement porosity as a prescribed function of particle mass with the fractal dimension as a free parameter. In this way, we parameterize the ill-constrained physics of colliding porous or fractal aggregates, and we can explore the effect of different porosity prescriptions. We take into account the effect of porosity on the dust dynamics, while neglecting its effect on the collision outcomes. Results. We find that larger particle masses are reached for lower fractal dimensions. The maximum Stokes numbers that are reached do not depend on the fractal dimension in the case of fragmentation-limited growth and decrease with decreasing fractal dimension in the case of bouncing-limited growth. Furthermore, particle growth is slower for smaller fractal dimensions in our models. Conclusions. Dust evolution is strongly influenced by the fractal dimension. Although larger masses are reached for smaller fractal dimensions, the particles are still much smaller than planetesimals. Under the assumption that the bouncing and fragmentation velocities do not depend on the fractal dimension or filling factor, fractal growth is not beneficial for the streaming instability to occur in the case of fragmentation-limited growth and even disadvantageous in the case of bouncing-limited growth.
