# Write here the body of the post. Some characters may break the parsing, so you can use quotes for the full body.
body: Context. Planets form through the growth and accumulation of dust grains in protoplanetary disks. Characterizing dust properties such as size, surface density, and temperature is key to understanding planet formation. Aims. We characterize the dust properties of the protoplanetary disk around HD 163296 by performing spectral energy distribution (SED) fitting of multi-wavelength high-resolution observations. Methods. We present new high-resolution ALMA Band 9 (0.45 mm) observations, which are sensitive to the temperature. We performed SED fitting at a common resolution of 0.066 arcsec using these new Band 9 observations along with archival ALMA Band 3, 4, 6, and 7 observations. We compared the fitted results with VLA observations and explored multiple dust models with different optical constants and porosities. Results. The Band 9 image shows the central disk, two rings at 0.67 and 1.00 arcsec, and outer extended emission previously seen at other wavelengths. At higher frequencies, the rings appear wider, the gaps appear shallower, and the extended emission appears brighter, which can be explained by optical-depth effects and/or size segregation. We characterized the dust properties, including temperature, surface density, and dust size, for each dust model. However, the inferred dust properties are dependent on the dust model, and the ALMA data alone do not allow us to determine which dust model is preferred. We identified the DSHARP Zubko (porous) model as the preferred model based on VLA profiles and physical and observational constraints. The outer ring temperature is lower than predicted by a passively irradiated disk model, suggesting shadowing by the inner ring. Although the surface density and dust size depend on the dust model, the preferred model indicates that the central disk, both rings, and the extended disk each contain more than a few Earth masses of dust.
